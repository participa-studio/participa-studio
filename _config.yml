# ─────────────────────────────────────────────────────────────
# PARTICIPA . STUDIO — SITE SETTINGS
# The shared look (header, footer, layouts) comes from participa-core.
# This file only says what is different about this site.
# ─────────────────────────────────────────────────────────────

remote_theme: participa-studio/participa-core
plugins:
  - jekyll-remote-theme

# Files that are for us, not for visitors
exclude:
  - README.md

# Blog posts (files in _posts/) live under the lab for now, hidden from search engines
defaults:
  - scope:
      path: "_posts"
    values:
      layout: post
      noindex: true
      permalink: /lab/blog/:title/

participa:
  core: https://participa-studio.github.io/participa-core
  version: 20261107-13          # raise this after every core change

  title: P A R T I C I P A º S T U D I O
  og_title: Participa Studio
  description: "Participa Studio: participatory and social design by Bernardo van de Schepop."

  own: studio                  # which logo is ours
  name: Studio                 # label next to our logo
  name_full: Participa Studio

  home_url: /lab/home/        # lab: the left logo opens the lab home (remove at launch, back to /)
  swarm: true                 # prototype: dots wander out from under the sister logo on the home page
  ants_say:                 # easter egg: a click on an ant shows one of these lines (call above, text below)
    - { call: Try, text: "Designing for a real world." }
    - { call: Try, text: "Staying with the trouble." }
    - { call: Try, text: "Eating like a fish." }
    - { call: Try, text: "Designing for the pluriverse." }
    - { call: Try, text: "Designing when everybody designs." }
    - { call: Try, text: "Working with the commons." }
    - { call: Tente, text: "Adiar o fim do mundo." }
    - { call: Note, text: "A garden without bugs is not part of an ecosystem." }
    - { call: Note, text: "We are not in nature. We are nature." }
    - { call: Note, text: "Nobody here works alone." }
    - { call: Note, text: "Every second breath comes from the ocean." }
    - { call: Ask, text: "When we can build anything, what should we build?" }
  sister:
    own: design
    name: Design
    name_full: Participa Design
    url: https://participa.design/lab/home/       # lab: sister logo opens the other lab home (back to https://participa.design/ at launch)

  nav:
    - title: Experiments
      url: /lab/projects/
      layouts: [case]
    - title: Writing
      url: /lab/blog/
      layouts: [post]
    - title: About
      url: /lab/about/

  kvk: "42023602"
  instagram: https://www.instagram.com/participa.studio/
  linkedin: https://www.linkedin.com/company/participa-design-studio/
  email: bernardo@schepop.org
