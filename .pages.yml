# ─────────────────────────────────────────────────────────────
# PAGES CMS — the editing screen for participa.studio
# Sign in at https://app.pagescms.org with GitHub and choose this repository.
# Pages and experiments are forms; Writing holds the blog posts (saved in _posts/).
# Save, and GitHub publishes the change in a minute or two.
# merge: true keeps any field the forms do not show (layout, noindex…).
# Unpublished posts are hidden on the site, but their text can be read in the
# repository, which is public. The paths point at the lab pages; at launch they move.
# ─────────────────────────────────────────────────────────────
media:
- name: blog
  label: Blog images
  input: images/blog
  output: /images/blog
  categories:
  - image
- name: images
  label: Images
  input: images
  output: /images
  categories:
  - image
- name: files
  label: Downloads
  input: files
  output: /files
  categories:
  - document
settings:
  content:
    merge: true
content:
- name: pages
  label: Pages
  type: group
  items:
  - name: home
    label: Home
    type: file
    path: lab/home/index.md
    fields:
    - name: title
      label: Browser tab title
      type: string
    - name: statement
      label: Main title
      type: text
    - name: intro
      label: Intro
      type: text
    - name: actions
      label: Buttons
      type: object
      fields: &id001
      - name: title
        label: Text
        type: string
      - name: url
        label: Link (e.g. /lab/cv/ or https://…)
        type: string
      list: true
    - name: work_heading
      label: Heading above the case
      type: string
    - name: work_link
      label: Link under the case
      type: object
      fields: *id001
  - name: about
    label: About
    type: file
    path: lab/about/index.md
    fields:
    - name: title
      label: Browser tab title
      type: string
    - name: heading
      label: Main title
      type: string
    - name: intro
      label: Intro
      type: text
    - name: practice
      label: What this site offers
      type: text
    - name: practice_links
      label: Links under that text
      type: object
      fields: *id001
      list: true
    - name: direction
      label: Direction line
      type: text
    - name: throughline
      label: Line leading into the sister panel
      type: text
    - name: sides
      label: Sister panel
      type: object
      fields:
      - name: own
        label: Which side
        type: select
        options:
          values:
          - design
          - studio
      - name: name
        label: Name
        type: string
      - name: tag
        label: Small label
        type: string
      - name: url
        label: Link
        type: string
      - name: text
        label: Text
        type: text
      - name: links
        label: Links
        type: object
        fields: *id001
        list: true
      list: true
    - name: facts
      label: Facts (label + value)
      type: object
      fields:
      - name: label
        label: Label
        type: string
      - name: value
        label: Value
        type: string
      list: true
    - name: contact
      label: Contact line (links as [text](https://…))
      type: text
  - name: experiments_page
    label: Experiments page
    type: file
    path: lab/projects/index.md
    fields:
    - name: title
      label: Browser tab title
      type: string
    - name: heading
      label: Main title
      type: string
    - name: intro
      label: Intro
      type: text
    - name: empty
      label: Text when the list is empty
      type: string
  - name: writing_page
    label: Writing page
    type: file
    path: lab/blog/index.md
    fields:
    - name: title
      label: Browser tab title
      type: string
    - name: heading
      label: Main title
      type: string
    - name: intro
      label: Intro
      type: text
    - name: empty
      label: Text when the list is empty
      type: string
