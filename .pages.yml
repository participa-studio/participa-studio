- name: posts
  label: Writing
  type: collection
  path: _posts
  filename: '{year}-{month}-{day}-{primary}.md'
  view:
    fields:
    - title
    - date
    - published
    primary: title
    sort:
    - date
    - title
    default:
      sort: date
      order: desc
  fields:
  - name: title
    label: Title
    type: string
    required: true
  - name: date
    label: Date
    type: date
    required: true
  - name: lead
    label: Opening line (shown in the Writing list)
    type: text
  - name: tags
    label: Tags (use a project name, e.g. ReFloat, to list the post on that project's page)
    type: string
    list: true
  - name: image
    label: Image
    type: image
    options:
      media: blog
  - name: image_alt
    label: Image description (for screen readers)
    type: string
  - name: published
    label: Publish on the site
    type: boolean
    default: false
  - name: body
    label: Text
    type: rich-text
